name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier container from sleeping
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://alaira-house-backend.onrender.com/api/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Non-200 status code received: $STATUS"
          fi
